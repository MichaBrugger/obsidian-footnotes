name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"
  # manual test run from the Actions tab: drafts a release named
  # <version>-manual-test. Drafts never create a git tag, so deleting the
  # draft afterwards leaves no trace.
  workflow_dispatch:

# gh release create needs write access even when the repo default is read-only.
# The other two are for the build-provenance attestation of the release
# assets: an OIDC token to sign with, and the right to store the
# attestation. Obsidian's community-page scorecard reported the assets as
# "Missing GitHub artifact attestations" (2026-09-16).
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Determine release tag
        id: tag
        run: |
          version="$(jq -r .version manifest.json)"
          beta_version="$(jq -r .version manifest-beta.json)"
          prerelease=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # suffix so a test run can't collide with a real release
            tag="$version-manual-test"
          else
            tag="${GITHUB_REF#refs/tags/}"
            # Obsidian requires the release tag to exactly match manifest.json's
            # version (no "v" prefix); a BRAT beta tag must match
            # manifest-beta.json instead. Fail fast on anything else rather
            # than drafting a broken release.
            if [ "$tag" = "$beta_version" ] && [ "$tag" != "$version" ]; then
              prerelease=true
            elif [ "$tag" != "$version" ]; then
              echo "Tag ($tag) matches neither manifest.json ($version) nor manifest-beta.json ($beta_version)." >&2
              exit 1
            elif [ "$beta_version" != "$version" ]; then
              # Older BRAT builds read manifest-beta.json's version straight
              # off the default branch and install THAT release, so a beta
              # manifest left at an old beta keeps every BRAT tester on it
              # after the stable release ships (Jason's report 2026-09-21,
              # beta.16 outranking 0.2.0). A stable release therefore has
              # to carry the same version in both manifests; the bump
              # script writes both, and this refuses a tag that skipped it.
              echo "manifest-beta.json ($beta_version) must match manifest.json ($version) for a stable release, or BRAT testers stay on the old beta." >&2
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      # gate the release on the checks a local green run implies; smoke
      # tests need a live Obsidian instance and stay a local pre-tag step
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx vitest run

      - name: Build plugin
        run: npm run build

      # Sign a statement that these exact files came out of this workflow
      # run, so anyone (Obsidian's scanner included) can verify the release
      # assets were built here and not swapped afterwards. The beta manifest
      # copy below happens after this, so the attested manifest.json is the
      # one in the repo; the beta release ships manifest-beta.json's content
      # under that name and is not attested as such.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=(--title "${{ steps.tag.outputs.tag }}" --draft)
          if [ "${{ steps.tag.outputs.prerelease }}" = "true" ]; then
            # BRAT installs the manifest.json shipped in the release, so a
            # beta release must ship the beta manifest under that name
            cp manifest-beta.json manifest.json
            args+=(--prerelease)
          fi
          gh release create "${{ steps.tag.outputs.tag }}" "${args[@]}" \
            main.js manifest.json styles.css
